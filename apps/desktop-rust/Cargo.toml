[package]
name = "roo-desktop-rust"
version = "1.0.0"
description = "Roo Code Desktop - High-Performance Rust & System WebView Platform"
authors = ["Roo Code"]
edition = "2021"

[lib]
name = "roo_desktop_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "roo-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-shell = "2.1"
tauri-plugin-dialog = "2.1"
tauri-plugin-opener = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tauri-plugin-clipboard-manager = "2.4.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
