name: Bug Report
description: Report a bug, unexpected behavior, or crash in Roo Code
labels: ["bug"]
title: "[BUG] "
body:
    - type: markdown
      attributes:
          value: |
              Thank you for reporting an issue! Please search existing issues first:
              https://github.com/RooCodeInc/Roo-Code/issues

    - type: textarea
      id: problem
      attributes:
          label: Problem Summary
          description: Provide a clear and concise description of what went wrong.
          placeholder: 'e.g. "Desktop application crashes on startup when connecting to local Ollama instance."'
      validations:
          required: true

    - type: input
      id: version
      attributes:
          label: App Version / Installer Version
          description: Which version of Roo Code or Desktop Installer are you using?
          placeholder: "e.g. v3.3.1 / Roo-Code-Setup-3.3.1-win-x64.exe"
      validations:
          required: true

    - type: dropdown
      id: os
      attributes:
          label: Operating System
          description: Select the operating system and architecture you are running on.
          options:
              - Windows 11 x64
              - Windows 10 x64
              - Windows ARM64
              - macOS (Apple Silicon - M1/M2/M3/M4)
              - macOS (Intel - x64)
              - Linux (Ubuntu / Debian x64)
              - Linux (Arch / Fedora / Other x64)
              - Linux ARM64
              - Other
      validations:
          required: true

    - type: dropdown
      id: provider
      attributes:
          label: API Provider
          description: Select the AI provider being used when the issue occurred.
          options:
              - Anthropic
              - OpenAI
              - OpenRouter
              - xKiro
              - Amazon Bedrock
              - Chutes AI
              - DeepSeek
              - Featherless AI
              - Fireworks AI
              - Google Gemini
              - Google Vertex AI
              - Groq
              - LiteLLM
              - LM Studio
              - Mistral AI
              - Ollama
              - OpenAI Compatible
              - Requesty
              - SambaNova
              - Unbound
              - VS Code Language Model API
              - xAI (Grok)
              - Not Applicable / Other

    - type: input
      id: model
      attributes:
          label: Model Name
          description: Exact model name used during the session (e.g. claude-3-7-sonnet, gpt-6-astra, deepseek-r1).
          placeholder: "e.g. claude-3-7-sonnet, gpt-6-astra"

    - type: textarea
      id: steps
      attributes:
          label: Reproduction Steps
          description: Provide clear, numbered steps to reproduce the issue.
          placeholder: |
              1. Launch Roo Code Desktop (or open VS Code extension)
              2. Set provider to ... and model to ...
              3. Enter prompt: "..."
              4. Observe the failure
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected Behavior
          description: What did you expect to happen?
          placeholder: 'e.g. "The task starts, terminal executes the command, and streaming response displays."'
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: Actual Behavior
          description: What actually happened?
          placeholder: 'e.g. "The application froze, terminal output failed to attach, and an error dialog appeared."'
      validations:
          required: true

    - type: textarea
      id: logs
      attributes:
          label: Diagnostic Logs & Terminal Output
          description: |
              Paste relevant diagnostic logs (e.g., from `startup-debug.log`, developer tools console, or terminal output).
              Please ensure any personal API keys or confidential credentials are redacted before pasting.
          placeholder: |
              Paste output from startup-debug.log or console here:
              ```
              [DEBUG] ...
              ```
          render: shell

    - type: textarea
      id: additional-context
      attributes:
          label: Additional Context
          description: Add any other context, screenshots, or screen recordings about the problem.
