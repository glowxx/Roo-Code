name: Feature Request
description: Propose an enhancement, new feature, or architectural improvement for Roo Code
labels: ["enhancement"]
title: "[FEATURE] "
body:
    - type: markdown
      attributes:
          value: |
              Thank you for helping improve Roo Code! Please check existing issues and discussions before submitting:
              https://github.com/RooCodeInc/Roo-Code/issues

    - type: textarea
      id: problem
      attributes:
          label: Problem Statement
          description: What problem are you trying to solve? Is your feature request related to a specific limitation or pain point?
          placeholder: 'e.g. "I often work across multiple local workspaces simultaneously, but currently have to switch folders manually."'
      validations:
          required: true

    - type: textarea
      id: proposed-solution
      attributes:
          label: Proposed Solution
          description: Describe the solution or behavior you would like to see. What should happen and how should it work?
          placeholder: 'e.g. "Add a multi-root workspace tab switcher or persistent workspace manager in the desktop sidebar."'
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives Considered
          description: Describe any alternative solutions, workflows, or features you have considered.
          placeholder: 'e.g. "Opening multiple instances of Roo Code Desktop, but this consumes more memory."'

    - type: textarea
      id: additional-context
      attributes:
          label: Additional Context
          description: Add any other context, UI mockups, diagrams, or references to other tools here.

    - type: checkboxes
      id: checklist
      attributes:
          label: Submission Checklist
          options:
              - label: I have searched existing Issues and Discussions for duplicates
                required: true
              - label: This proposal describes a clear problem with a well-defined use case
                required: true
